<!DOCTYPE html>
<html>
<head>
  <title>Slick Playground</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" type="text/css" href="./slick/slick.css">
  <link rel="stylesheet" type="text/css" href="./slick/slick-theme.css">
  <style type="text/css">
    html, body {
      margin: 0;
      padding: 0;
    }

    * {
      box-sizing: border-box;
    }

    .slider {
        width: 50%;
        height: 150px;
        margin: 100px auto;
    }
    .slider img 
    {
      width: 100%;
      height: 150px;
    }

    .slick-slide {
      margin: 0px 20px;
    }

    .slick-slide img {
      width: 100%;
    }

    .slick-prev:before,
    .slick-next:before {
      color: black;
    }


    .slick-slide {
      transition: all ease-in-out .3s;
      opacity: .2;
    }
    
    .slick-active {
      opacity: .5;
    }

    .slick-current {
      opacity: 1;
    }
  </style>
</head>
<body>

  <section class="regular slider">
    <div>
      <img src="https://wowslider.com/sliders/demo-18/data1/images/hongkong1081704.jpg">
    </div>
    <div>
      <img src="https://cdn.smartslider3.com/wp-content/uploads/slider/cache/64ad7a13c00e20b5819a2db23106edd2/imageslider-background1.jpg">
    </div>
    <div>
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSIxtquBn3v6GGr2ZlCbFHGeVs-MImLJpjP58w2Yx8MOw_rt3F-7TfowLJx&s=10">
    </div>
    <div>
      <img src="https://ps.w.org/ml-slider/assets/banner-1544x500.png?rev=3568997">
    </div>
    <div>
      <img src="https://wowslider.com/sliders/demo-87/data1/images/landscape615428_1280.jpg">
    </div>
    <div>
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRo_6cowzqGGlab3UpmAc929Ks3wE7PtMsufPoeubcNs0qfiFbsAAQoS8_6&s=10">
    </div>
  </section>

  <section class="center slider">
  <div>
      <img src="https://wowslider.com/sliders/demo-18/data1/images/hongkong1081704.jpg">
    </div>
    <div>
      <img src="https://cdn.smartslider3.com/wp-content/uploads/slider/cache/64ad7a13c00e20b5819a2db23106edd2/imageslider-background1.jpg">
    </div>
    <div>
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSIxtquBn3v6GGr2ZlCbFHGeVs-MImLJpjP58w2Yx8MOw_rt3F-7TfowLJx&s=10">
    </div>
    <div>
      <img src="https://ps.w.org/ml-slider/assets/banner-1544x500.png?rev=3568997">
    </div>
    <div>
      <img src="https://wowslider.com/sliders/demo-87/data1/images/landscape615428_1280.jpg">
    </div>
    <div>
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRo_6cowzqGGlab3UpmAc929Ks3wE7PtMsufPoeubcNs0qfiFbsAAQoS8_6&s=10">
    </div>
  </section>



  <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
  <script src="./slick/slick.js" type="text/javascript" charset="utf-8"></script>
  <script type="text/javascript">
    $(function() {
      $(".vertical-center-4").slick({
        dots: true,
        vertical: true,
        centerMode: true,
        slidesToShow: 4,
        slidesToScroll: 2
      });
      $(".vertical-center-3").slick({
        dots: true,
        vertical: true,
        centerMode: true,
        slidesToShow: 3,
        slidesToScroll: 3
      });
      $(".vertical-center-2").slick({
        dots: true,
        vertical: true,
        centerMode: true,
        slidesToShow: 2,
        slidesToScroll: 2
      });
      $(".vertical-center").slick({
        dots: true,
        vertical: true,
        centerMode: true,
      });
      $(".vertical").slick({
        dots: true,
        vertical: true,
        slidesToShow: 3,
        slidesToScroll: 3
      });
      $(".regular").slick({
        dots: true,
        infinite: true,
        slidesToShow: 3,
        slidesToScroll: 3
      });
      $(".center").slick({
        dots: true,
        infinite: true,
        centerMode: true,
        slidesToShow: 5,
        slidesToScroll: 3
      });
      $(".variable").slick({
        dots: true,
        infinite: true,
        variableWidth: true
      });
      $(".lazy").slick({
        lazyLoad: 'ondemand', // ondemand progressive anticipated
        infinite: true
      });
    });
</script>

</body>
</html>
