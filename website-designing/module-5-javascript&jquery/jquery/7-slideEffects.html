<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
<!-- called jquery online CDN -->
<script src="https://code.jquery.com/jquery-4.0.0.js"></script>
<script>
$(document).ready(function(){
$(".content").css({"width":"60%","height":"auto","margin":"auto","padding":"25px"});
$("#btn1").click(function(){
    $("#para").slideDown(2000);
});
$("#btn2").click(function(){
    $("#para").slideUp(2000);
});

$("#btn3").click(function(){
    $("#para").slideToggle(2000);
});
})
</script> 
</head>
<body>
<div class="content">
<button type="button" id="btn1">Slide Down</button>
<button type="button" id="btn2">Slide Up</button>
<button type="button" id="btn3">Slide Toggle</button>
<p id="para"> Lorem ipsum dolor sit amet consectetur adipisicing elit. Distinctio delectus ab nostrum, odit voluptas quia neque aspernatur dolorem laudantium sequi unde perspiciatis est hic autem facere cumque laboriosam, dolores quaerat?</>

</div>
</body>
</html>
