
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Append Table Row Using jQuery</title>

    <!-- jQuery CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background: #f3f4f6;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background: #2563eb;
            color: white;
        }

        button {
            background: #16a34a;
            color: white;
            border: none;
            padding: 10px 18px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: #15803d;
        }
    </style>
</head>

<body>

    <h2>Student Table</h2>

    <button id="appendRow">Append New Row</button>

    <table id="studentTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Course</th>
                <th>City</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>1</td>
                <td>Rahul</td>
                <td>BCA</td>
                <td>Ahmedabad</td>
            </tr>

            <tr>
                <td>2</td>
                <td>Priya</td>
                <td>BBA</td>
                <td>Surat</td>
            </tr>
        </tbody>
    </table>

    <script>
        $(document).ready(function () {

            let id = $("#studentTable tbody tr").length + 1;

            $("#appendRow").click(function () {

                let newRow = `
                    <tr>
                        <td>${id}</td>
                        <td>New Student ${id}</td>
                        <td>BCA</td>
                        <td>Vadodara</td>
                    </tr>
                `;

                $("#studentTable tbody").append(newRow);

                id++;
            });

        });
    </script>

</body>
</html>
