<script>
/*
switch : switch is used just like if elseif to check multiple true case if case is true it executed if false default is executed. 
syntax :
switch(condition)
{
  case 'A':
    statements;
    break;
  case 'B':
    statements;
    break;
  case 'C':
    statements;
    break;
  case 'D':
    statements;
    break;
  default:
    statements;
    break;
}

*/

var grade='D';
switch(grade)
{
 case 'A':
    document.write("i am topper students &#9786");
    break;
case 'B':
    document.write("i am average students &#9786");
    break;
case 'C':
    document.write("i am failed students &#9785");
    break;
default:
    document.write("sorry your grade not found anywhere contact with admin");
    break;
}
</script>
