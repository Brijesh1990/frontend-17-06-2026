<script>
/*
do while : do will be executed once time either condition is true or false after while loop is checked if condition is tue it will executed otherwise is not executed.

        
 syntax :
 do
 {
   statements;
   increment/decrement;
 }
 while(condition);
*/ 

var i=0;
do 
{
document.write(i,"<br>");
i++;
}
while(i<=10);

</script>
