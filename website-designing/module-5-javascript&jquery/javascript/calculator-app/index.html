<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Calculator</title>
  <!-- Tailwind CSS v4 -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- calculator js -->
   <script src="js/calc.js"></script>
</head>

<body class="min-h-screen bg-slate-950 flex items-center justify-center p-4">

  <!-- Calculator -->
  <div class="w-full max-w-sm overflow-hidden rounded-3xl bg-slate-900 shadow-2xl ring-1 ring-white/10">

    <!-- Display -->
    <div class="flex h-32 flex-col justify-end bg-slate-900 px-6 py-5 text-right">

      <div class="overflow-hidden text-4xl font-semibold tracking-tight text-white">
     <input type="text" placeholder="0" class="bg-slate-950 text-end text-white w-full" id="result" />
      </div>
    </div>

    <!-- Buttons -->
    <div class="bg-slate-950 p-3">
      <table class="w-full border-separate border-spacing-2">
        <tbody>

          <!-- Row 1 -->
          <tr>
            <td>
              <button type="button" onclick="inputClr()"
                class="h-16 w-full rounded-2xl bg-slate-700 text-xl font-semibold text-slate-200 transition hover:bg-slate-600 active:scale-95"
              >
                AC
              </button>
            </td>

            <td>
              <button type="button" onclick="sliceInput()"
                class="h-16 w-full rounded-2xl bg-slate-700 text-xl font-semibold text-slate-200 transition hover:bg-slate-600 active:scale-95"
              >
                <
              </button>
            </td>

            <td>
              <button type="button" value="%" onclick="return inputValue(this.value)"
                class="h-16 w-full rounded-2xl bg-slate-700 text-xl font-semibold text-slate-200 transition hover:bg-slate-600 active:scale-95"
              >
                %
              </button>
            </td>

            <td>
              <button type="button" value="/" onclick="return inputValue(this.value)"
                class="h-16 w-full rounded-2xl bg-orange-500 text-xl font-bold text-white transition hover:bg-orange-400 active:scale-95"
              >
                ÷
              </button>
            </td>
          </tr>

          <!-- Row 2 -->
          <tr>
            <td>
              <button type="button" value="7" onclick="return inputValue(this.value)"
                class="h-16 w-full rounded-2xl bg-slate-800 text-xl font-semibold text-white transition hover:bg-slate-700 active:scale-95"
              >
                7
              </button>
            </td>

            <td>
              <button type="button" value="8" onclick="return inputValue(this.value)"
                class="h-16 w-full rounded-2xl bg-slate-800 text-xl font-semibold text-white transition hover:bg-slate-700 active:scale-95"
              >
                8
              </button>
            </td>

            <td>
              <button type="button" value="9" onclick="return inputValue(this.value)"
                class="h-16 w-full rounded-2xl bg-slate-800 text-xl font-semibold text-white transition hover:bg-slate-700 active:scale-95"
              >
                9
              </button>
            </td>

            <td>
              <button type="*" value="*" onclick="return inputValue(this.value)"
                class="h-16 w-full rounded-2xl bg-orange-500 text-xl font-bold text-white transition hover:bg-orange-400 active:scale-95"
              >
                ×
              </button>
            </td>
          </tr>

          <!-- Row 3 -->
          <tr>
            <td>
              <button type="4" value="4" onclick="return inputValue(this.value)"
                class="h-16 w-full rounded-2xl bg-slate-800 text-xl font-semibold text-white transition hover:bg-slate-700 active:scale-95"
              >
                4
              </button>
            </td>

            <td>
              <button type="5" value="5" onclick="return inputValue(this.value)"
                class="h-16 w-full rounded-2xl bg-slate-800 text-xl font-semibold text-white transition hover:bg-slate-700 active:scale-95"
              >
                5
              </button>
            </td>

            <td>
              <button type="6" value="6" onclick="return inputValue(this.value)"
                class="h-16 w-full rounded-2xl bg-slate-800 text-xl font-semibold text-white transition hover:bg-slate-700 active:scale-95"
              >
                6
              </button>
            </td>

            <td> 
              <button type="-" value="-" onclick="return inputValue(this.value)"
                class="h-16 w-full rounded-2xl bg-orange-500 text-xl font-bold text-white transition hover:bg-orange-400 active:scale-95"
              >
                −
              </button>
            </td>
          </tr>

          <!-- Row 4 -->
          <tr>
            <td>
              <button type="button" value="1" onclick="return inputValue(this.value)"
                class="h-16 w-full rounded-2xl bg-slate-800 text-xl font-semibold text-white transition hover:bg-slate-700 active:scale-95"
              >
                1
              </button>
            </td>

            <td>
              <button type="button" value="2" onclick="return inputValue(this.value)"
                class="h-16 w-full rounded-2xl bg-slate-800 text-xl font-semibold text-white transition hover:bg-slate-700 active:scale-95"
              >
                2
              </button>
            </td>

            <td>
              <button type="button" value="3" onclick="return inputValue(this.value)"
                class="h-16 w-full rounded-2xl bg-slate-800 text-xl font-semibold text-white transition hover:bg-slate-700 active:scale-95"
              >
                3
              </button>
            </td>

            <td rowspan="2">
              <button type="button" value="+" onclick="return inputValue(this.value)"
                class="h-full min-h-32 w-full rounded-2xl bg-orange-500 text-xl font-bold text-white transition hover:bg-orange-400 active:scale-95"
              >
                +
              </button>
            </td>
          </tr>

          <!-- Row 5 -->
          <tr>
            <td colspan="2">
              <button type="button" value="0" onclick="return inputValue(this.value)"
                class="h-16 w-full rounded-2xl bg-slate-800 text-left pl-6 text-xl font-semibold text-white transition hover:bg-slate-700 active:scale-95"
              >
                0
              </button>
            </td>

            <td>
              <button type="button" value="." onclick="return inputValue(this.value)"
                class="h-16 w-full rounded-2xl bg-slate-800 text-xl font-semibold text-white transition hover:bg-slate-700 active:scale-95"
              >
                .
              </button>
            </td>
          </tr>

          <!-- Equal Row -->
          <tr>
            <td colspan="4">
              <button type="button" onclick="finalResult()"
                class="h-16 w-full rounded-2xl bg-white text-xl font-bold text-slate-950 transition hover:bg-slate-200 active:scale-[0.98]"
              >
                =
              </button>
            </td>
          </tr>

        </tbody>
      </table>
    </div>

  </div>

</body>
</html>
