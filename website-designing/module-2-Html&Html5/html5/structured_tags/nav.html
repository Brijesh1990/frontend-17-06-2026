<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
<style>
body 
{
margin: 0;
padding: 0;
overflow-x: hidden;
box-sizing: border-box;    
}
header
{
width: 100%;
height: auto;
padding: 0px;
background-color: lightseagreen;
display: flex;
flex-wrap: nowrap;
}   
header h1 
{
width: 30%;
height: auto;
margin-left: 2%;
color: white;
font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;    
} 
header input 
{
width: 50%;
height: 40px;
padding: 5px;
margin-top: 1%;
}
header button
{
width: 12%;
height: 40px;
padding: 2px;
margin-left: 2%;
margin-top: 1%;    
} 

nav 
{
width: 100%;
height: auto;
margin: auto;
background-color: black;    
}
nav ul 
{    
margin: 0;    
padding: 0;
margin-top: 0;
margin-left: 31%;
}
nav ul li 
{
display: inline-block;
padding: 20px 30px;    
}
nav ul li a 
{
text-decoration: none;
list-style-type: none;
color: white;
font-size: 20px;
text-transform: capitalize;    
}
</style>
</head>
<body>
<!-- header -->
<header>
<h1>Logo</h1>
<input type="search" placeholder="search products here">
<button type="button">Create account 👥</button>    
</header>
<!-- nav -->
<nav>
<ul>
<li><a href="#">Home</a></li>
<li><a href="#">About</a></li>
<li><a href="#">services</a></li>
<li><a href="#">gallery</a></li>
<li><a href="#">products</a></li>
<li><a href="#">cart 🛒(10)</a></li>
</ul>    
</nav> 
</body>
</html>
