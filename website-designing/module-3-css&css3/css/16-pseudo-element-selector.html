<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
<style>
.app
{
width: 30%;
height: auto;
margin: auto;
margin-top: 5%;
padding: 20px;
background-color: black;
color: white;    
}    
.app p::after
{
content: "Pandey";
font-size: 20px;
letter-spacing: 1px;
margin-left: 2%;
color: red;
font-weight: 600;
font-style: italic;
text-transform: uppercase;
font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
}
.nav
{
width: 50%;
height: auto;
margin: auto;
padding: 2px;
background-color: black;
margin-top: 2%;    
}
.nav ul li 
{
display: inline-block;    
padding: 2px 12px;
}
.nav a 
{
text-decoration: none;
list-style-type: none;    
color: white;
}
.nav ul li::after
{
content: "⚡";    
}
.nav1
{
width: 50%;
height: auto;
margin: auto;
padding: 2px;
background-color: black;
margin-top: 2%;    
}
.nav1 ul li 
{
display: inline-block;    
padding: 2px 12px;
}
.nav1 a 
{
text-decoration: none;
list-style-type: none;    
color: white;
}
.nav1 ul li::before
{
content: "🏃🏿‍♂️";    
}

.nav2
{
width: 50%;
height: auto;
margin: auto;
padding: 2px;
background-color: black;
margin-top: 2%;    
}
.nav2 ul li 
{
display: inline-block;    
padding: 2px 2px;
}
.nav2 a 
{
text-decoration: none;
list-style-type: none;    
color: white;
}
.nav2 ul li::before,
.nav2 ul li::after
{
content: "⭐";    
}
</style>
</head>
<body>

<div class="app">
<p>Hey brijesh</p>
</div>

<div class="nav">
    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">gallery</a></li>
        <li><a href="#">services</a></li>
        <li><a href="#">feedback</a></li>
        <li><a href="#">contact</a></li>
    </ul>
</div>


<div class="nav1">
    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">gallery</a></li>
        <li><a href="#">services</a></li>
        <li><a href="#">feedback</a></li>
        <li><a href="#">contact</a></li>
    </ul>
</div>



<div class="nav2">
    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">gallery</a></li>
        <li><a href="#">services</a></li>
        <li><a href="#">feedback</a></li>
        <li><a href="#">contact</a></li>
    </ul>
</div>
</body>
</html>
