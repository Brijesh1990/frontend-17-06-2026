<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
<style>
    .box1
    {
    width: 50%;
    height: 200px;
    margin: auto;
    padding: 15px;
    border: solid 3px;    
    margin-top: 10%;
    }
    .box2
    {
    width: 90%;
    height: 150px;
    margin: auto;
    padding: 15px;
    border: solid 3px;    
    margin-top: 2%;
    }
    
    .box3
    {
    width: 80%;
    height: 100px;
    margin: auto;
    padding: 15px;
    border: solid 3px;    
    margin-top: 2%;
    }
    
    .box4
    {
    width: 70%;
    height: 50px;
    margin: auto;
    padding: 15px;
    border: solid 3px;    
    margin-top: 2%;
    }

    
    .box5
    {
    width: 60%;
    height: 25px;
    margin: auto;
    padding: 15px;
    border: solid 3px;    
    margin-top: -1%;
    }
</style>
</head>
<body>
<!-- 
margin:space after border in any webpage i.e called margin
examples: margin:20px
          margin-left:20px
          margin-right:20px
          margin-top:20px
          margin-bottom:20px
padding:space after nd between content and border in any section i.e called padding 
examples: padding:20px
          padding-left:20px
          padding-right:20px
          padding-top:20px
          padding-bottom:20px
       

-->

<div class="box1">
    <div class="box2">
        <div class="box3">
            <div class="box4">
                <div class="box5"></div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
