<script>
/*

nested if  statements : if within another if or condition within another condition i.e called nested if statements

syntax :

if (condition)
{
  if(condition)
  { 
    statements 
  }
}
else
{
statements
}

*/

let a=40;
let b=35; 
if(a>b)
{
    if(a!=0 && b!=0)
   {
    console.log("a is greater than b and both are positive numbers")    
   }
}
else 
{
console.log("a is less than b")    
}

</script>
