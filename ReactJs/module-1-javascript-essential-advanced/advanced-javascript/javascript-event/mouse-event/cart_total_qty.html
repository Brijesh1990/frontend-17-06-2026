<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
<style>
body 
{
margin: 0;
padding: 0;    
}    
.cart-app
{
width: 50%;
height: auto;
margin: auto;
margin-top: 5%;    
}
</style>

<script>
function subTotals()
{
 var p=document.getElementById("price").value;
 var q=document.getElementById("qty").value;
 var total=p*q;
 document.getElementById("tot").innerHTML=total;   
}    
</script>
</head>
<body>
<div class="cart-app">
<table align="center" width="100%" border="0">
    <tr align="center">
        <td><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTnV1jlNFu20vOKrjT42J5gi2LflIX_UnYFwBycM5KuBA&s=10" style="width: 100px; "></td>
        <td>samsung galaxy</td>
        <td><input type="number" value="1" min="1" max="10" style="width: 150px;" id="qty" onchange="subTotals()"></td>
        <td>Rs.<input type="text" id="price" value="8500" style="border: none; width: 50px;"> /-</td>
    </tr>
    <tr>
        <td colspan="4"><h2 align="right">subtotal of products Rs. <label id="tot">8500</label></h2></td>
    </tr>
</table>
</div>
</body>
</html>
