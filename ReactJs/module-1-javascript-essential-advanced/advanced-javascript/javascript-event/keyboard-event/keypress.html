<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
<script>
function display()
{
document.getElementById("para").style="color:red; font-size:65px; transition:2s ease all; text-align:center; margin-top:5%";    
}    
</script>
</head>
<body>
<p id="para">Hey i am Brijesh</p>    
<button type="button" onkeypress="display()">Key Press here ?</button>
</body>
</html>
